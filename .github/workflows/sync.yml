name: Sync K10 Wiki

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 00:00 UTC = 北京 08:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Discover URLs
        run: node scripts/discover-urls.js

      - name: Crawl pages
        run: node scripts/crawl.js

      - name: Generate sidebar
        run: node scripts/gen-sidebar.js

      - name: Build check
        run: npm run docs:build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync K10 wiki'
          title: 'chore: sync K10 wiki'
          body: |
            自动同步行空板 K10 官方文档。
            由 GitHub Actions 每周一生成。
          branch: bot/sync-k10
          delete-branch: true
          add-paths: |
            urls.json
            state.json
            docs/wiki
            docs/public/images
            docs/.vitepress/sidebar.mts