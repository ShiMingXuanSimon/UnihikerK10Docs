name: Sync K10 Wiki

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 18:00 UTC = 北京 02:00,原站维护空窗期
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Discover URLs
        run: node scripts/discover-urls.js

      - name: Crawl pages
        run: node scripts/crawl.js

      - name: Generate sidebar
        run: node scripts/gen-sidebar.js

      - name: Build check
        run: npm run docs:build

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes, skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add urls.json state.json docs/wiki docs/public/images docs/.vitepress/sidebar.mts
          git commit -m "chore: sync K10 wiki $(date -u +%Y-%m-%d)"
          git push